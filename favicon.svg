<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#120722"/>
    <stop offset="55%" stop-color="#090411"/>
    <stop offset="100%" stop-color="#1b0630"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#9b5cff"/>
    <stop offset="50%" stop-color="#d82cff"/>
    <stop offset="100%" stop-color="#ff7be8"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<circle cx="256" cy="256" r="151" fill="none" stroke="url(#ring)" stroke-width="34" filter="url(#glow)"/>
<ellipse cx="256" cy="256" rx="226" ry="82" transform="rotate(-16 256 256)"
         fill="none" stroke="url(#ring)" stroke-width="27" stroke-linecap="round" filter="url(#glow)"/>
</svg>